# 회사 정보. current: true이면 startMonth부터 현재 한국 날짜까지 월 단위로 계산한다.
# startMonth는 따옴표로 감싼 YYYY-MM 형식. 퇴사 시 current를 false로 바꾸고 period와 durationMonths(확정 경력 개월 수)를 기입한다.
# id 는 content/timeline/*.md 의 frontmatter 에 있는 company 값과 짝을 이룬다.

